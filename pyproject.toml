[project]
name = "sift"
version = "0.1.0"
description = "Self-hosted invoice extraction: OCR + local LLM + validation + human review, built on FastAPI and Celery."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.1.9",
    "psycopg[binary]>=3.3.9",
    "alembic>=1.14",
    "celery[redis]>=5.7.0",
    "redis>=5.2",
    "boto3>=1.35",
    "structlog>=24.4",
    "pypdf>=5.1",
    "flower>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "boto3-stubs[s3]>=1.44.9",
    "testcontainers[postgres,redis]>=4.15.0",
    "moto[server]>=5.2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "ASYNC",         # async pitfalls
    "SIM", "RUF", "PL", "PT", "TID", "C4", "DTZ", "LOG",
]
ignore = [
    "PLR0913",  # FastAPI endpoints legitimately take many params
    "B008",     # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sift"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "testcontainers.*"]
ignore_missing_imports = true

# Celery/kombu are only partially typed; relax strictness at the boundary only.
[[tool.mypy.overrides]]
module = ["sift.workers.*", "sift.adapters.celery_queue"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real Postgres/Redis/S3 (testcontainers or INTEGRATION_* env vars)",
]

[tool.coverage.run]
source = ["sift"]
branch = true

# ---------------------------------------------------------------- import-linter
# Enforces the dependency rule from TRD §4.
[tool.importlinter]
root_package = "sift"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "sift.main",
    "sift.api | sift.workers",
    # Siblings: services must not import adapters/db, and vice versa.
    # Only the composition roots (api.deps, workers) wire them together.
    "sift.services | sift.adapters | sift.db",
    "sift.ports",
    "sift.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and services are framework-free"
type = "forbidden"
source_modules = ["sift.domain", "sift.services", "sift.ports"]
forbidden_modules = ["fastapi", "starlette", "celery", "sqlalchemy", "boto3"]
