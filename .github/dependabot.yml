version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      python-deps: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    schedule: { interval: weekly }
